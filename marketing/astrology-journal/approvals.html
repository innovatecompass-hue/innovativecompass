<style>
/* Layout: sticky summary bar, then a calendar of day cards (1 column on phones, 2-3 on desktop). */
:root {
  --bg: #fbf6f2; --surface: #ffffff; --ink: #2b2236; --muted: #6e6178; --line: #eadfe6;
  --teal: #237f79; --teal-soft: #dff3f0; --pink: #c2477f; --pink-soft: #fbe4ee;
  --lav-soft: #eee7f7; --shadow: 0 10px 28px -20px rgba(43, 34, 54, .55);
  --display: "Abril Fatface", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, sans-serif;
  --label: "Josefin Sans", "Avenir Next", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18131d; --surface: #241d2b; --ink: #f4eef7; --muted: #b6a9bf; --line: #3a3043;
    --teal: #7fd6cd; --teal-soft: #1f3a39; --pink: #f3a0c6; --pink-soft: #45263a;
    --lav-soft: #2f2639; --shadow: 0 10px 28px -20px rgba(0, 0, 0, .8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18131d; --surface: #241d2b; --ink: #f4eef7; --muted: #b6a9bf; --line: #3a3043;
  --teal: #7fd6cd; --teal-soft: #1f3a39; --pink: #f3a0c6; --pink-soft: #45263a;
  --lav-soft: #2f2639; --shadow: 0 10px 28px -20px rgba(0, 0, 0, .8); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
h1 { font: 400 1.5rem/1.1 var(--display); margin: 0; text-wrap: balance; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.pill { font: 600 .72rem/1 var(--label); letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px 5px; border-radius: 999px; background: var(--lav-soft); color: var(--ink); white-space: nowrap; }
.pill.ok { background: var(--teal-soft); color: var(--teal); }
.pill.redo { background: var(--pink-soft); color: var(--pink); }
.quality { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.quality span { font: 600 .72rem var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 .85rem var(--body); padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.intro { padding-block: 18px 6px; color: var(--muted); max-width: 70ch; }
.intro strong { color: var(--ink); }
.notice { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--pink-soft); color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding-block: 16px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.card.ok { border-color: var(--teal); }
.card.redo { border-color: var(--pink); }
.head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.date { font: 600 .8rem var(--label); letter-spacing: .12em; text-transform: uppercase; }
.setting { font-size: .78rem; color: var(--muted); }
.head .pill { margin-left: auto; }
.lines { margin: 0; display: grid; gap: 6px; }
.lines p { margin: 0; font-size: 1rem; }
.lines b { font: 600 .7rem var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
details { font-size: .88rem; color: var(--muted); }
details summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details p { margin: 6px 0 0; white-space: pre-line; }
.open { display: flex; gap: 8px; flex-wrap: wrap; }
.open a { flex: 1 1 auto; text-align: center; text-decoration: none; font: 600 .78rem/1 var(--label); letter-spacing: .1em; text-transform: uppercase; padding: 12px 14px 11px; border-radius: 10px; background: var(--ink); color: var(--surface); }
.open a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.open .none { flex: 1; text-align: center; padding: 11px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); font-size: .85rem; }
.review { display: flex; gap: 8px; }
.review button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px; padding: 10px; font: 500 .9rem var(--body); cursor: pointer; }
.review button.approve[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--surface); }
.review button.redo[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--surface); }
.review button:disabled { opacity: .5; cursor: not-allowed; }
textarea { width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: .9rem var(--body); padding: 9px 11px; }
@media (max-width: 600px) { .quality { margin-left: 0; } .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .2s ease; } }
</style>

const grid = document.getElementById("grid");
const countsEl = document.getElementById("counts");
const notice = document.getElementById("notice");
let reviews = {};
let month = "dec";
try { month = localStorage.getItem("approvals-month") || "dec"; } catch {}
const shown = () => POSTS.filter((p) => p.id.startsWith(month));
let db = null;
const pending = {}; // one write at a time per document

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function renderCounts() {
  const list = shown();
  const generated = list.filter((p) => p.images.length).length;
  const ok = list.filter((p) => reviews[p.id]?.status === "approved").length;
  const redo = list.filter((p) => reviews[p.id]?.status === "redo").length;
  countsEl.replaceChildren(
    el("span", { class: "pill ok" }, `${ok} approved`),
    el("span", { class: "pill redo" }, `${redo} redo`),
    el("span", { class: "pill" }, `${generated}/${list.length} generated`),
  );
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.month === month));
}

function card(p) {
  const r = reviews[p.id] || {};
  const status = r.status === "approved" ? ["ok", "Approved"] : r.status === "redo" ? ["redo", "Redo"] : ["", p.images.length ? "To review" : "Not made yet"];
  const open = p.images.length
    ? el("div", { class: "open" }, ...p.images.map(([label, url]) => el("a", { href: url, target: "_blank", rel: "noopener" }, label === "Open full size" ? "Open full size ↗" : `${label} ↗`)))
    : el("div", { class: "open" }, el("span", { class: "none" }, "Being generated"));
  const can = Boolean(db) && p.images.length > 0;
  const note = el("textarea", { id: `note-${p.id}`, placeholder: "Note for a redo (optional)", "aria-label": `Note for ${p.date}` });
  note.value = r.note || "";
  note.disabled = !db;
  note.addEventListener("change", () => save(p.id, { note: note.value.trim() }));
  return el("article", { class: `card ${status[0]}` },
    el("div", { class: "head" }, el("span", { class: "date" }, p.date), el("span", { class: "setting" }, p.setting), el("span", { class: `pill ${status[0]}` }, status[1])),
    el("div", { class: "lines" }, el("p", {}, el("b", {}, "Lyra"), `“${p.left}”`), el("p", {}, el("b", {}, "Vela"), `“${p.right}”`)),
    open,
    el("div", { class: "review" },
      el("button", { type: "button", id: `ok-${p.id}`, class: "approve", "aria-pressed": String(r.status === "approved"), onclick: () => save(p.id, { status: r.status === "approved" ? null : "approved" }) }, "Approve"),
      el("button", { type: "button", id: `redo-${p.id}`, class: "redo", "aria-pressed": String(r.status === "redo"), onclick: () => save(p.id, { status: r.status === "redo" ? null : "redo" }) }, "Redo"),
    ),
    note,
    el("details", {}, el("summary", {}, "Caption"), el("p", {}, p.caption)),
  );
}

function render() {
  // Keep an unsaved note (and its cursor) when a live update redraws the cards.
  const active = document.activeElement?.tagName === "TEXTAREA" ? document.activeElement : null;
  const keep = active && { id: active.id, value: active.value, start: active.selectionStart };
  renderCounts();
  grid.replaceChildren(...shown().map(card));
  if (keep) {
    const t = document.getElementById(keep.id);
    t.value = keep.value;
    t.focus();
    t.setSelectionRange(keep.start, keep.start);
  }
  for (const b of grid.querySelectorAll(".review button")) {
    const id = b.id.replace(/^(ok|redo)-/, "");
    b.disabled = !db || !POSTS.find((p) => p.id === id).images.length;
  }
}

async function save(id, patch) {
  if (!db) return;
  const next = { ...(reviews[id] || {}), ...patch, updatedAt: Date.now() };
  reviews[id] = next;
  render();
  pending[id] = (pending[id] || Promise.resolve()).then(() => db.collection("reviews").doc(id).set(next)).catch((e) => {
    notice.textContent = `Couldn't save that choice (${e.code || "error"}). Try again in a moment.`;
    notice.hidden = false;
  });
}

for (const b of document.querySelectorAll(".seg button")) {
  b.addEventListener("click", () => {
    month = b.dataset.month;
    try { localStorage.setItem("approvals-month", month); } catch {}
    render();
  });
}

render();

(async () => {
  db = await window.claude?.use?.("db");
  if (!db) {
    notice.textContent = "Sign in to claude.ai to save approvals. You can still open every post full size.";
    notice.hidden = false;
    return;
  }
  render();
  db.collection("reviews").onSnapshot((snap) => {
    reviews = {};
    for (const d of snap.docs) reviews[d.id] = d.data();
    render();
  }, (e) => { notice.textContent = `Live updates stopped (${e.code}). Reload the page.`; notice.hidden = false; });
})();
</script>
